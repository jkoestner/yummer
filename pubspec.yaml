name: nutrition_tracker
description: A nutrition tracking app with Open Food Facts, Mealie integration, and OCR label scanning.

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Existing dependencies
  intl: ^0.18.0
  openfoodfacts: ^3.27.0
  http: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # New dependencies for OCR scanner feature
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.11.0
  permission_handler: ^11.3.0
  
  # Barcode scanner
  mobile_scanner: ^5.2.3

  # File operations for import/export
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/yummer_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/yummer_icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/yummer_icon.png"
  adaptive_icon_background: "#FFFFFF"